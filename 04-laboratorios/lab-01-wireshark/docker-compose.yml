# Lab 01 - Análise de tráfego. Ambiente isolado: rede interna, sem exposição externa.
services:
  web:
    image: nginx:alpine
    volumes:
      - ./web/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web/index.html:/usr/share/nginx/html/index.html:ro
    networks:
      labnet:
        ipv4_address: 172.28.0.10

  cliente:
    image: nicolaka/netshoot
    command: >
      sh -c 'while true; do
        nslookup web >/dev/null 2>&1;
        curl -s http://web/ >/dev/null;
        curl -s -X POST -d "usuario=ana&senha=SenhaFraca123" http://web/login >/dev/null;
        sleep 5; done'
    depends_on: [web]
    networks:
      labnet:
        ipv4_address: 172.28.0.20

  sniffer:
    image: nicolaka/netshoot
    network_mode: "service:cliente"
    cap_add: [NET_ADMIN, NET_RAW]
    command: tcpdump -i any -U -w /capturas/trafego.pcap
    volumes:
      - ./capturas:/capturas

  ferramentas:
    image: nicolaka/netshoot
    profiles: [tools]
    cap_add: [NET_ADMIN, NET_RAW]
    volumes:
      - ./capturas:/capturas
    networks:
      labnet:
        ipv4_address: 172.28.0.30

networks:
  labnet:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.28.0.0/24
